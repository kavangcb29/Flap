name: Auto Contributor

on:
  schedule:
    # Runs every 5 minutes (maximum frequency)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Activity
        run: |
          echo "Activity logged at $(date -u)" >> ACTIVITY.md

      - name: Commit and Push
        run: |
          git config --global user.name "kavangcb29"
          git config --global user.email "kavangcb@gmail.com"
          git add ACTIVITY.md
          git commit -m "Auto-generate GitHub activity [skip ci]" || echo "No changes to commit"
          git push origin main
