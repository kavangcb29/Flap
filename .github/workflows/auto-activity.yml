name: Auto Contributor

on:
  schedule:
    # Runs once a day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Random Commits and Push
        run: |
          git config --global user.name "kavangcb29"
          git config --global user.email "kavangcb@gmail.com"
          
          # Generate a random number between 8 and 20
          NUM_COMMITS=$(( ( RANDOM % 13 )  + 8 ))
          echo "Targeting $NUM_COMMITS commits for today."
          
          for i in $(seq 1 $NUM_COMMITS); do
            echo "Activity logged at $(date -u) - batch $i" >> ACTIVITY.md
            git add ACTIVITY.md
            git commit -m "Auto-generate GitHub activity batch $i [skip ci]"
          done
          
          git push origin main
