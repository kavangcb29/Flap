<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Plane</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3571863616373313" crossorigin="anonymous"></script>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Ad Banner (Top) -->
        <div class="ad-banner top">
            <p>AD SPACE</p>
        </div>

        <!-- Home Screen -->
        <div id="home-screen" class="ui-overlay">
            <h1>Flappy Plane</h1>
            <p>Conquer the Skies!</p>
            <div class="btn-group">
                <button id="home-play-btn">Play Now</button>
                <button id="levels-btn">Select Level</button>
            </div>
        </div>

        <!-- Level Select Screen -->
        <div id="level-screen" class="ui-overlay hidden">
            <h2>Select Level</h2>
            <div class="level-grid" id="level-grid">
                <!-- Levels generated by JS -->
            </div>
            <button id="back-home-btn" class="secondary-btn">Back</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="ui-overlay hidden">
            <h1>Game Over</h1>
            <p>Score: <span id="final-score">0</span></p>
            <div class="btn-group">
                <button id="restart-btn">Try Again</button>
                <button id="home-btn" class="secondary-btn">Home</button>
            </div>
        </div>

        <!-- Level Complete Screen -->
        <div id="level-complete-screen" class="ui-overlay hidden">
            <h1>Congratulations!</h1>
            <p>Level <span id="completed-level">1</span> Completed!</p>
            <div class="btn-group">
                <button id="next-level-btn">Next Level</button>
                <button id="home-btn-complete" class="secondary-btn">Home</button>
            </div>
        </div>

        <!-- Ad Banner (Bottom) -->
        <div class="ad-banner bottom">
            <p>AD SPACE</p>
        </div>

        <div id="score-display" class="hidden">0</div>
        <div id="level-display" class="hidden">Level 1</div>
    </div>
    <script src="game.js"></script>
</body>

</html>
