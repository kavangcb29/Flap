<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Plane</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3571863616373313" crossorigin="anonymous"></script>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J6WVQ568D2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-J6WVQ568D2');
    </script>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Ad Banner (Top) -->
        <div class="ad-banner top">
            <p>AD SPACE</p>
        </div>

        <!-- Home Screen -->
        <div id="home-screen" class="ui-overlay">
            <h1>Flappy Plane</h1>
            <p>Conquer the Skies!</p>
            <p class="high-score-text">Best Score: <span id="home-high-score">0</span></p>
            <div class="skin-selector" id="skin-selector">
                <button class="skin-btn active" data-skin="0" title="Neon Pink" style="background: #f72585;"></button>
                <button class="skin-btn" data-skin="1" title="Golden Bomber" style="background: #FFD700;"></button>
                <button class="skin-btn" data-skin="2" title="Cyan Jet" style="background: #00FFFF;"></button>
                <button class="skin-btn" data-skin="3" title="Stealth Black" style="background: #1a1a1a;"></button>
            </div>
            <div class="btn-group">
                <button id="home-play-btn">Play Now</button>
                <button id="levels-btn">Select Level</button>
            </div>
        </div>

        <!-- Level Select Screen -->
        <div id="level-screen" class="ui-overlay hidden">
            <h2>Select Level</h2>
            <div class="level-grid" id="level-grid">
                <!-- Levels generated by JS -->
            </div>
            <button id="back-home-btn" class="secondary-btn">Back</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="ui-overlay hidden">
            <h1>Game Over</h1>
            <p>Score: <span id="final-score">0</span></p>
            <p class="high-score-text">Best Score: <span id="gameover-high-score">0</span></p>
            <div class="btn-group">
                <button id="restart-btn">Try Again</button>
                <button id="home-btn" class="secondary-btn">Home</button>
            </div>
        </div>

        <!-- Level Complete Screen -->
        <div id="level-complete-screen" class="ui-overlay hidden">
            <h1>Congratulations!</h1>
            <p>Level <span id="completed-level">1</span> Completed!</p>
            <div class="btn-group">
                <button id="next-level-btn">Next Level</button>
                <button id="home-btn-complete" class="secondary-btn">Home</button>
            </div>
        </div>

        <!-- Ad Banner (Bottom) -->
        <div class="ad-banner bottom">
            <p>AD SPACE</p>
        </div>

        <div id="score-display" class="hidden">0</div>
        <div id="level-display" class="hidden">Level 1</div>
        <div id="progress-bar-container" class="hidden">
            <div id="progress-bar"></div>
        </div>
        <button id="sound-toggle-btn" class="sound-btn" title="Toggle Sound">🔊</button>
    </div>
    <script src="game.js"></script>
</body>

</html>
